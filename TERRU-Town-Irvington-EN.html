const $ = s => document.querySelector(s);
const FLAG_EN = { '증축여지': 'Room to add', '저평가': 'Underpriced', '타운홈형': 'Townhome-style', '⚠홍수AE': '⚠ Flood AE', 'ADU있음': 'Has ADU' };
const fl = f => FLAG_EN[f] || f;
const DIR_EN = { COS: 'Cosmetic', ADDN: 'Heavy addition → 1,800 sf', DADU: 'Detached ADU 800 sf + light reno' };
const dname = d => DIR_EN[d.k] || d.name;
const dwhy = d => d.why_en || d.why;
D.town.poi.forEach(o => o.n = o.n.replace('건설 중', 'under construction'));
const fmt$ = v => v == null ? '—' : '$' + Math.round(v).toLocaleString();
const fmtK = v => v == null ? '—' : (v >= 1000 ? '$' + (v/1000).toFixed(2).replace(/\.?0+$/,'') + 'M' : '$' + v + 'K');
const fmtN = v => v == null ? '—' : Math.round(v).toLocaleString();
const ALL = [...D.active, ...D.sold].filter(p => p.lat);
const byId = Object.fromEntries(ALL.map(p => [p.id, p]));
let state = { kinds: new Set(['active','sold']), flags: new Set(), q: '', sort: 'net', pmax: null, bd: 0, lot: 0, sel: null, tr: false };
let visible = [];

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: true }).setView(D.town.center, D.town.zoom);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
const mkIcon = (cls) => L.divIcon({ className: '', html: `<div class="mk ${cls}"></div>`, iconSize: [14,14], iconAnchor: [7,7] });
const markers = {};
ALL.forEach(p => { const m = L.marker([p.lat, p.lng], { icon: mkIcon(p.kind) }).addTo(map); m.on('click', () => select(p.id, true)); m.bindTooltip(`${p.addr} · ${fmt$(p.price)}${p.kind==='sold'?' (sold)':''}`); markers[p.id] = m; });
D.town.poi.forEach(o => L.marker([o.lat, o.lng], { icon: mkIcon(o.t) }).addTo(map).bindTooltip(o.n));
const trLayer = L.layerGroup(D.transfers.map(r => L.circleMarker([r[5], r[4]], { radius: 3, color: '#a99a78', weight: 1, fillColor: '#c9bfa8', fillOpacity: .8 }).bindTooltip(`${r[1]} · reassessed ${fmtK(r[2])} · ${r[3]}`)));
$('#trbtn').onclick = () => { state.tr = !state.tr; $('#trbtn').classList.toggle('on', state.tr); state.tr ? trLayer.addTo(map) : trLayer.remove(); };

/* ---------- list ---------- */
function passes(p) {
  if (!state.kinds.has(p.kind)) return false;
  if (state.pmax && p.price > state.pmax*1000) return false;
  if (state.bd && (p.bd||0) < state.bd) return false;
  if (state.lot && ((p.parcel_sqft||p.lot||0) < state.lot)) return false;
  for (const f of state.flags) { if (f === 'r16') { if (p.zoning !== 'R-1-6') return false; } else if (!(p.flags||[]).includes(f)) return false; }
  if (state.q) { const q = state.q.toLowerCase(); if (!(`${p.addr} ${p.apn||''} ${p.zoning} ${(p.tags||[]).join(' ')} ${p.remarks||''}`.toLowerCase().includes(q))) return false; }
  return true;
}
const sorters = { net: (a,b) => (a.kind!==b.kind ? (a.kind==='active'?-1:1) : ((b.best_net??-1e9) - (a.best_net??-1e9))), price: (a,b) => a.price-b.price, ppsf: (a,b) => (a.ppsf||9e9)-(b.ppsf||9e9), lot: (a,b) => (b.parcel_sqft||b.lot||0)-(a.parcel_sqft||a.lot||0), dom: (a,b) => (a.dom??999)-(b.dom??999), disc: (a,b) => (b.discount??-99)-(a.discount??-99) };
function render() {
  visible = ALL.filter(passes).sort(sorters[state.sort]);
  const act = visible.filter(p => p.kind === 'active');
  $('#cnt').textContent = `${visible.length} homes (${act.length} for sale · ${visible.length-act.length} sold)`;
  const pp = act.map(p => p.ppsf).filter(Boolean).sort((a,b)=>a-b);
  $('#med').textContent = pp.length ? `Median asking $${pp[Math.floor(pp.length/2)]}/sf · median sold $${D.params.med_ppsf}/sf` : '';
  $('#list').innerHTML = visible.map(p => `<div class="card ${p.id===state.sel?'sel':''}" data-id="${p.id}">
    <div class="a">${p.addr}</div><div class="p">${fmt$(p.price)}</div>
    <div class="m">${p.bd??'?'}bd/${p.ba??'?'}ba · ${fmtN(p.sqft)}sf · lot ${fmtN(p.parcel_sqft||p.lot)} · ${p.yr||''} · ${p.ppsf?'$'+p.ppsf+'/sf':''} ${p.kind==='sold'?'· <b>Sold</b> '+(p.soldDate||'within 6 mo'):(p.dom!=null?'· DOM '+p.dom:'')}</div>
    <div class="f">${p.kind==='active'&&p.best_net!=null?`<span class="chip ${p.best_net>=150?'g':p.best_net>=0?'w':'b'}">${p.verdict} ${p.best} ${p.best_net>=0?'+':''}${fmtK(p.best_net)}</span>`:''}${(p.flags||[]).map(f=>`<span class="chip ${f==='SB9'||f==='ADU'?'g':f.startsWith('⚠')?'b':f==='저평가'?'g':(f.startsWith('P-')||f.startsWith('R-3')||f.startsWith('R-G'))?'p':''}">${fl(f)}</span>`).join('')}${p.kind==='sold'?'<span class="chip s">comp</span>':''}</div>
  </div>`).join('') || '<div class="empty">No listings match these filters.</div>';
  Object.values(markers).forEach(m => m.setOpacity(0.25));
  visible.forEach(p => markers[p.id].setOpacity(1));
  $('#hsub').textContent = `${D.active.length} for sale · ${D.sold.length} sold 6 mo · ${D.transfers.length} recent transfers · built ${D.built}`;
}
$('#list').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) select(+c.dataset.id, true); });
$('#q').oninput = e => { state.q = e.target.value.trim(); render(); };
$('#sort').onchange = e => { state.sort = e.target.value; render(); };
$('#pmax').oninput = e => { state.pmax = +e.target.value || null; render(); };
$('#bd').onchange = e => { state.bd = +e.target.value; render(); };
$('#lot').onchange = e => { state.lot = +e.target.value; render(); };
document.querySelectorAll('.filters .chipbtn[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k); b.classList.toggle('on'); render(); });
document.querySelectorAll('#flagrow .chipbtn').forEach(b => b.onclick = () => { const f = b.dataset.f; state.flags.has(f) ? state.flags.delete(f) : state.flags.add(f); b.classList.toggle('on'); render(); });

/* ---------- detail ---------- */
const prov = (k) => `<span class="prov ${k}">${k}</span>`;
function select(id, pan) {
  if (state.sel && markers[state.sel]) markers[state.sel].setIcon(mkIcon(byId[state.sel].kind));
  state.sel = id; const p = byId[id]; if (!p) return;
  markers[id].setIcon(mkIcon(p.kind + ' sel'));
  if (pan) map.panTo([p.lat, p.lng]);
  location.hash = '#p/' + id;
  render();
  const i = visible.findIndex(x => x.id === id);
  const lot = p.parcel_sqft || p.lot;
  const dirs = (p.dirs||[]).map(d => `<div class="dir ${d.k===p.best?'best':''}"><div class="n">${dname(d)} <small style="color:var(--mute)">${d.mo} mo</small></div><div class="net ${d.net>=0?'pos':'neg'}">${d.net>=0?'+':''}${fmtK(d.net)}</div><div class="why">ARV ${fmtK(d.arv)} − purchase ${fmtK(Math.round(p.price/1000))} − construction ${fmtK(d.cost)} − 7% selling − carry · ${dwhy(d)}</div></div>`).join('');
  const comps = (p.comps||[]).map(c => `<tr><td>${c.addr}</td><td class="r">${c.bd}/${c.ba}</td><td class="r">${fmtN(c.sqft)}</td><td class="r">${fmt$(c.price)}</td><td class="r"><b>$${c.ppsf}</b></td><td class="r">${c.mi}mi</td></tr>`).join('');
  const best = (p.dirs||[]).find(d => d.k === p.best);
  $('#detail').classList.add('open');
  $('#detail').innerHTML = `
  <div class="nav"><button class="btn" id="prev">←</button><button class="btn" id="next">→</button><span class="sub" style="font-size:12px;color:var(--mute)">${i+1} / ${visible.length}</span><span class="sp"></span>${p.url?`<a class="btn" target="_blank" href="https://www.redfin.com${p.url}">Redfin ↗</a>`:''}<button class="btn" id="close">✕</button></div>
  <div class="d">
    <h2>${p.addr}</h2><div class="sub">Fremont 94538 · ${p.kind==='sold'?'<b>Sold '+(p.soldDate||'within 6 mo')+'</b>':(p.status||'')+(p.dom!=null?' · DOM '+p.dom:'')} · ${p.mls?'MLS '+p.mls:''}</div>
    <div class="kpi"><div><b>${fmt$(p.price)}</b><span>${p.kind==='sold'?'Sold price':'Asking'} · $${p.ppsf||'—'}/sf</span></div><div><b>${p.bd??'?'} / ${p.ba??'?'}</b><span>${fmtN(p.sqft)} sf · built ${p.yr||'?'}</span></div><div><b>${fmtN(lot)} sf</b><span>lot ${p.parcel_sqft?'(parcel, geodesic)':'(listing)'}</span></div></div>
    ${p.kind==='active'&&best?`<div class="black">${p.verdict} Buy at <b>${fmt$(p.price)}</b>, spend <b>${fmtK(best.cost)}</b> on <b>${dname(best)}</b>, sell for <b>${fmtK(best.arv)}</b> after ${best.mo} months → left over <b>${best.net>=0?'+':''}${fmtK(best.net)}</b><br><small style="opacity:.75">Unit costs & timelines are TERRU estimates · ARV = top-quartile $/sf of nearby sold comps × area · no projection (current comps only)</small></div>`:''}
    <div class="sec"><h3>① As it stands — published facts</h3><table>
      <tr><th>Zoning</th><td><b>${p.zoning}</b> · GP ${p.gp} (${p.dens} du/ac)${prov('official')}</td></tr>
      <tr><th>APN · Assessed</th><td>${p.apn||'—'} · taxable ${fmt$(p.net)} (land ${fmtK(Math.round((p.land||0)/1000))} / improvements ${fmtK(Math.round((p.imps||0)/1000))})${p.hoex?' · homeowner exemption':''} · last doc ${p.doc||'—'}${prov(p.apn?'official':'todo')}</td></tr>
      <tr><th>Flood · Fire</th><td>FEMA ${p.flood} · FHSZ ${p.fire} · climate zone ${p.cz}${prov('official')}</td></tr>
      <tr><th>Seismic</th><td>Liquefaction / AP fault zones — CGS server down, unverified (near Hayward Fault: must check)${prov('todo')}</td></tr>
      <tr><th>Envelope</th><td>${p.zoning==='R-1-6'?'R-1-6: setbacks front 20 · side 5/12 · rear 25 ft · 40% lot coverage · 17 ft (1-story) / 30 ft (2-story) · 2nd floor ≤ 50% of 1st or 1,000 sf · ministerial design review (≤ 7,500 sf) · detached ADU 1,200 sf / 16 ft (18 ft within ½ mi of BART) · SB9 eligible':(p.zoning.startsWith('P-')?'PD (planned district): district-specific standards — check the plan · state SB9/ADU law still applies':p.zoning+' — not in ref_zoning_standards, check the ordinance')}${prov(p.zoning==='R-1-6'?'official':'research')}</td></tr>
      <tr><th>Flags</th><td>${(p.flags||[]).map(f=>`<span class="chip">${fl(f)}</span>`).join(' ')||'—'}</td></tr>
    </table></div>
    ${p.remarks?`<div class="sec"><h3>Listing remarks (Redfin · internal)</h3><div class="remarks">${p.remarks}${(p.tags||[]).length?'<br><small>'+p.tags.join(' · ')+'</small>':''}</div></div>`:''}
    ${dirs?`<div class="sec"><h3>② Investment value — net by strategy ${prov('estimate')}</h3>${dirs}<div class="sub" style="font-size:11px">Price check: asking $${p.ppsf||'—'}/sf vs nearby comps median $${p.comp_med}/sf → <b>${p.discount!=null?(p.discount>=0?p.discount+'% below':(-p.discount)+'% above'):'—'}</b> · post-reno basis $${p.comp_top}/sf</div></div>`:''}
    <div class="sec"><h3>③ Comps — nearby sales, last 6 mo (beds ±1)</h3><table><tr><th>Address</th><th class="r">bd/ba</th><th class="r">sf</th><th class="r">Sold</th><th class="r">$/sf</th><th class="r">Dist</th></tr>${comps||'<tr><td colspan=6>—</td></tr>'}</table><div class="sub" style="font-size:11px">Redfin sale records · internal validation only · production replaces with county reassessments (map: recent transfers) + RentCast/MLS</div></div>
    <div class="sec"><h3>5 checks before you offer</h3><ol style="margin:0;padding-left:18px;font-size:12.5px"><li>CGS seismic zones (liquefaction · AP fault) — verify manually on EQ Zapp</li><li>Permit history — Fremont AgencyCounter (unpermitted additions / ADU)</li><li>${(p.yr||2000)<1978?'Pre-1978: lead (EPA RRP) & asbestos (BAAQMD) survey':'Structural & foundation inspection'}</li><li>Plumbing (galvanized / cast iron) · electrical panel (100A→200A) — critical systems</li><li>School assignment — FUSD locator (Irvington / Kennedy / Mission)</li></ol></div>
  </div>`;
  $('#prev').onclick = () => { if (i > 0) select(visible[i-1].id, true); };
  $('#next').onclick = () => { if (i < visible.length-1) select(visible[i+1].id, true); };
  $('#close').onclick = () => { $('#detail').classList.remove('open'); };
  $('#detail').scrollTop = 0;
}
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const i = visible.findIndex(x => x.id === state.sel); if (e.key === 'ArrowRight' && i < visible.length-1) select(visible[i+1].id, true); if (e.key === 'ArrowLeft' && i > 0) select(visible[i-1].id, true); if (e.key === 'Escape') $('#detail').classList.remove('open'); });

/* ---------- sources ---------- */
$('#srcpanel').innerHTML = `<b>Data sources · policy</b> (built ${D.built})<table style="margin-top:6px">${D.sources.map(s => `<tr><td>${s.k_en||s.k}</td><td>${s.src_en||s.src}</td><td>${s.prov_en||s.prov}</td></tr>`).join('')}</table><div style="margin-top:6px;color:var(--mute)">Portal (Redfin) values are for <b>internal prototype validation only</b> — no redistribution or commercial use (Decisions 2026-09-12). Production data layer = public records + licensed data. Unit costs · timelines · coefficients = ScoringParams (estimate). No projection — every ARV is on current comps. Not legal advice.</div>`;
$('#srcbtn').onclick = () => $('#srcpanel').classList.toggle('on');

render();
const h = location.hash.match(/#p\/(\d+)/); if (h && byId[+h[1]]) select(+h[1], true);
</script>
</body>
</html>
